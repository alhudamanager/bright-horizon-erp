<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback</title>
<style>
:root{
  --blue-950:#052A57; --blue-900:#083A75; --blue-700:#0B57B0; --blue-600:#0F7AE5; --blue-100:#E4F1FD; --blue-50:#F2F9FF;
  --ink:#16213A; --muted:#5B6A88; --line:#DCE4F3; --gold:#F4B740; --green:#0E8A4F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:linear-gradient(160deg,var(--blue-50),#fff 60%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:var(--ink)}
.card{background:#fff;border-radius:20px;max-width:440px;width:100%;padding:32px 28px;box-shadow:0 20px 60px rgba(5,42,87,.18);text-align:center;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(244,183,64,.25),transparent 70%);pointer-events:none}
.brand{font-size:13px;color:var(--blue-700);font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;position:relative}
h1{font-size:20px;color:var(--blue-900);margin-bottom:6px;position:relative}
p.sub{color:var(--muted);font-size:13.5px;line-height:1.6;margin-bottom:20px;position:relative}
.stars{display:flex;justify-content:center;gap:8px;margin:18px 0 6px;font-size:38px;line-height:1;position:relative}
.stars span{cursor:pointer;color:#E3E9F5;transition:.15s;user-select:none}
.stars span.on{color:var(--gold)}
.stars span:hover{transform:scale(1.15)}
.rate-label{font-size:12.5px;color:var(--muted);min-height:16px;margin-bottom:14px}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:14px;resize:vertical;min-height:90px;margin-bottom:18px;position:relative}
textarea:focus{outline:2px solid var(--blue-600);border-color:var(--blue-600)}
button{width:100%;background:linear-gradient(90deg,var(--blue-600),#3D95EE);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(15,122,229,.35);position:relative}
button:disabled{opacity:.5;cursor:default}
button:hover:not(:disabled){filter:brightness(1.07)}
.thanks{display:none}
.thanks .tick{font-size:52px;margin-bottom:10px}
.thanks h1{color:var(--green)}
.err{display:none;color:#C0392B;font-size:13.5px;line-height:1.6}
.foot{font-size:11.5px;color:#AEB9CF;margin-top:20px;position:relative}
</style>
</head>
<body>
<div class="card" id="mainCard">
  <div id="formState">
    <div class="brand" id="brandLine">Feedback</div>
    <h1 id="title">How are we doing?</h1>
    <p class="sub" id="subLine">Your honest feedback helps us improve every class.</p>
    <div class="stars" id="stars">
      <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
    </div>
    <div class="rate-label" id="rateLabel">Tap a star to rate</div>
    <textarea id="comment" placeholder="Anything you'd like to tell us? (optional)"></textarea>
    <button id="submitBtn" onclick="submitFeedback()">Submit Feedback</button>
  </div>
  <div class="thanks" id="thanksState">
    <div class="tick">✅</div>
    <h1>Thank you!</h1>
    <p class="sub">Your feedback has been received. We really appreciate you taking the time.</p>
  </div>
  <div class="err" id="errState"></div>
  <div class="foot" id="footLine"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
let rating=0,fbDb=null,params=null;

function showError(msg){
  document.getElementById("formState").style.display="none";
  const e=document.getElementById("errState");
  e.style.display="block";
  e.textContent=msg;
}

function init(){
  params=new URLSearchParams(location.search);
  const db=params.get("db"), sid=params.get("sid"), name=params.get("name")||"your child",
        brand=params.get("brand")||"Our Institute", cfgB64=params.get("cfg");
  document.getElementById("brandLine").textContent=brand;
  document.getElementById("title").textContent="How is "+name+" doing?";
  document.getElementById("footLine").textContent=brand+" — Monthly Feedback";
  if(!db||!sid||!cfgB64){showError("This feedback link looks incomplete. Please ask "+brand+" to send you a fresh link.");return;}
  let cfg;
  try{ cfg=JSON.parse(decodeURIComponent(escape(atob(cfgB64)))); }
  catch(e){ showError("This feedback link could not be read. Please ask for a fresh link.");return; }
  if(typeof firebase==="undefined"){showError("Could not load — please check your internet connection and try again.");return;}
  try{
    if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(cfg);
    fbDb=firebase.firestore();
  }catch(e){showError("Could not connect. Please ask for a fresh link.");return;}
}

document.getElementById("stars").addEventListener("click",e=>{
  const v=e.target.getAttribute("data-v");
  if(!v)return;
  rating=+v;
  document.querySelectorAll("#stars span").forEach(s=>s.classList.toggle("on",+s.getAttribute("data-v")<=rating));
  const labels={1:"Poor",2:"Fair",3:"Good",4:"Very good",5:"Excellent"};
  document.getElementById("rateLabel").textContent=labels[rating]+" — tap to change";
});

async function submitFeedback(){
  if(!rating){alert("Please tap a star to rate before submitting.");return;}
  if(!fbDb){alert("Not connected — please reload this page.");return;}
  const btn=document.getElementById("submitBtn");
  btn.disabled=true;btn.textContent="Submitting…";
  try{
    await fbDb.collection("feedback_submissions").add({
      storageKey:params.get("db"),
      studentId:params.get("sid"),
      studentName:params.get("name")||"",
      rating,
      comment:document.getElementById("comment").value.trim(),
      submittedAt:Date.now()
    });
    document.getElementById("formState").style.display="none";
    document.getElementById("thanksState").style.display="block";
  }catch(e){
    console.error(e);
    btn.disabled=false;btn.textContent="Submit Feedback";
    alert("Could not submit — please check your internet connection and try again.");
  }
}
init();
</script>
</body>
</html>
