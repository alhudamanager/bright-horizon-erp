<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave Request</title>
<style>
:root{
  --blue-950:#052A57; --blue-900:#083A75; --blue-700:#0B57B0; --blue-600:#0F7AE5; --blue-100:#E4F1FD; --blue-50:#F2F9FF;
  --ink:#16213A; --muted:#5B6A88; --line:#DCE4F3; --gold:#F4B740; --green:#0E8A4F; --red:#C0392B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:linear-gradient(160deg,var(--blue-50),#fff 60%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--ink)}
.card{background:#fff;border-radius:18px;max-width:460px;width:100%;padding:0 0 28px;box-shadow:0 10px 30px rgba(5,42,87,.12);overflow:hidden}
.hero{background:linear-gradient(120deg,var(--blue-950),var(--blue-700));color:#fff;padding:24px 26px;text-align:center}
.logo{width:48px;height:48px;background:#fff;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--blue-900);font-size:17px;margin:0 auto 8px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.hero h1{font-size:17px}
.hero p{font-size:12px;opacity:.85;margin-top:3px}
.pad{padding:22px 26px 0}
label{display:block;font-size:12.5px;font-weight:700;color:#3A4A68;margin:14px 0 6px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14.5px;font-family:inherit}
textarea{resize:vertical}
button{width:100%;background:linear-gradient(90deg,var(--blue-600),#3D95EE);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:20px}
button:hover{filter:brightness(1.06)}
.err{color:var(--red);font-size:13px;margin-top:8px;display:none}
#successScreen{display:none;text-align:center;padding:20px 26px 6px}
#successScreen .ic{font-size:44px;margin-bottom:10px}
#successScreen h2{color:var(--blue-900);font-size:18px;margin-bottom:8px}
#successScreen p{color:var(--muted);font-size:13.5px;line-height:1.6}
#formScreen{display:none}
.loading{text-align:center;padding:50px 26px;color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <div class="hero">
    <div class="logo" id="logoBox">🌴</div>
    <h1 id="brandName">Bright Horizon</h1>
    <p>Leave Request Form</p>
  </div>

  <div class="loading" id="loadingScreen">Connecting…</div>

  <div id="formScreen">
    <div class="pad">
      <label>Student's name *</label>
      <input id="stName" placeholder="Full name">
      <label>Your WhatsApp number *</label>
      <input id="parentPhone" placeholder="e.g. 447712345678" inputmode="tel">
      <label>Leave start date *</label>
      <input type="date" id="fromDate">
      <label>Expected return date *</label>
      <input type="date" id="toDate">
      <label>Reason (optional)</label>
      <textarea id="reason" rows="3" placeholder="e.g. Family travel, exams, medical"></textarea>
      <p class="err" id="formErr"></p>
      <button onclick="submitRequest()">Submit Leave Request</button>
    </div>
  </div>

  <div id="successScreen">
    <div class="ic">✅</div>
    <h2>Request submitted</h2>
    <p>Thank you — we've received your leave request and will confirm it shortly. If you don't hear back within a day, please message us directly on WhatsApp.</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
const params=new URLSearchParams(location.search);
const dbKey=params.get("db");
const cfgB64=params.get("cfg");
const brand=params.get("brand");
if(brand)document.getElementById("brandName").textContent=brand;
let db;

async function init(){
  if(!dbKey||!cfgB64){showErr("This form link is incomplete. Please ask the institute for a fresh link.");return;}
  let cfg;
  try{cfg=JSON.parse(decodeURIComponent(escape(atob(cfgB64))));}
  catch(e){showErr("This form link could not be read.");return;}
  try{
    if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(cfg);
    db=firebase.firestore();
    document.getElementById("loadingScreen").style.display="none";
    document.getElementById("formScreen").style.display="block";
    const today=new Date().toISOString().slice(0,10);
    document.getElementById("fromDate").value=today;
    const d=new Date();d.setDate(d.getDate()+14);
    document.getElementById("toDate").value=d.toISOString().slice(0,10);
  }catch(e){
    console.error(e);
    showErr("Could not connect. Please check your internet connection and try again.");
  }
}
function showErr(msg){
  document.getElementById("loadingScreen").style.display="none";
  document.getElementById("formScreen").style.display="block";
  const el=document.getElementById("formErr");
  el.textContent=msg;el.style.display="block";
}

async function submitRequest(){
  const name=document.getElementById("stName").value.trim();
  const phone=document.getElementById("parentPhone").value.replace(/[^0-9]/g,"");
  const from=document.getElementById("fromDate").value;
  const to=document.getElementById("toDate").value;
  const reason=document.getElementById("reason").value.trim();
  const err=document.getElementById("formErr");
  err.style.display="none";
  if(!name){err.textContent="Please enter the student's name.";err.style.display="block";return;}
  if(!phone){err.textContent="Please enter your WhatsApp number.";err.style.display="block";return;}
  if(!from||!to){err.textContent="Please pick both dates.";err.style.display="block";return;}
  if(to<from){err.textContent="Return date must be after the start date.";err.style.display="block";return;}
  try{
    await db.collection("erp_leave_requests").add({
      branchKey:dbKey,studentName:name,phone,from,to,reason,
      status:"pending",submittedAt:Date.now(),submittedDate:new Date().toISOString().slice(0,10)
    });
    document.getElementById("formScreen").style.display="none";
    document.getElementById("successScreen").style.display="block";
  }catch(e){
    console.error(e);
    err.textContent="Could not submit — please try again, or message us directly.";
    err.style.display="block";
  }
}
init();
</script>
</body>
</html>
